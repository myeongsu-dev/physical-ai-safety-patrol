# 관제 노트북 Mosquitto 설정: 같은 Wi-Fi의 Pi들이 붙을 수 있게 모든 주소에서 받는다.
# 기본 설정은 노트북 자신(127.0.0.1)만 받아서 Pi가 못 붙는다.
#
# Windows (관리자 PowerShell):
#   Copy-Item server\mosquitto.conf "C:\Program Files\mosquitto\mosquitto.conf"
#   Restart-Service mosquitto
# 직접 띄울 때: mosquitto -c server/mosquitto.conf -v
#
# 시연용 내부 망이라 로그인 없이 받는다. 공용 Wi-Fi에서 오래 켜 두지 않는다.

listener 1883
allow_anonymous true
