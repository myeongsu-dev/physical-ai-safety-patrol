<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>안전 순찰 관제</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="evacuate" id="evacuate" hidden>대피 모드: 가까운 비상구로 대피하세요</div>

<header class="bar">
  <h1>안전 순찰 관제</h1>
  <div class="conn">
    <div class="conn-item" id="server">
      <span class="dot"></span>
      <span class="label">서버</span>
      <span class="value">연결 중</span>
    </div>
    <div class="conn-item" id="robots">
      <span class="dot"></span>
      <span class="label">로봇</span>
      <span class="value">-</span>
    </div>
  </div>
</header>

<div class="notice" id="notice" hidden></div>

<main>
  <section class="status" aria-label="현재 상황">
    <dl>
      <div>
        <dt>현재 모드</dt>
        <dd id="mode">-</dd>
      </div>
      <div>
        <dt>안전 현황</dt>
        <dd><span class="level" id="level">-</span></dd>
      </div>
      <div>
        <dt>화재·과열</dt>
        <dd class="count" id="count-fire">-</dd>
      </div>
      <div>
        <dt>통로 차단</dt>
        <dd class="count" id="count-obstacle">-</dd>
      </div>
      <div>
        <dt>밟힘 주의</dt>
        <dd class="count" id="count-floor">-</dd>
      </div>
    </dl>
  </section>

  <section class="robot-list" aria-label="로봇 연결">
    <h2>로봇 연결</h2>
    <ul id="robot-list"></ul>
  </section>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
